<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doctor login · Sharada Child Care, Hoskote</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body data-page="doctor">
  <header>
    <a class="brand" href="index.html"><img src="images/logo.svg" alt="" width="32" height="32">Sharada Child Care</a>
    <nav>
      <a href="index.html">Book</a>
      <a href="doctor.html">Doctor login</a>
    </nav>
    <div class="auth" id="auth-bar" hidden>
      <span id="auth-label"></span>
      <button class="link" id="signout" type="button">Log out</button>
    </div>
  </header>

  <main>
    <section class="card login-card" id="login">
      <img class="card-art" src="images/doctor.svg" alt="" width="96" height="96">
      <h1>Doctor login</h1>
      <p class="sub">Enter your doctor name to see appointments.</p>
      <form id="login-form" novalidate>
        <div class="grid">
          <div class="full">
            <label for="login-code">Doctor name</label>
            <input id="login-code" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required>
          </div>
        </div>
        <div class="actions">
          <button class="btn" type="submit">Log in</button>
        </div>
      </form>
      <div class="msg" id="login-msg" hidden></div>
    </section>

    <div id="dashboard" hidden>
      <div class="stats">
        <div class="stat"><div class="n" id="stat-today">0</div><div class="l">Booked today</div></div>
        <div class="stat"><div class="n" id="stat-upcoming">0</div><div class="l">Upcoming (active)</div></div>
        <div class="stat"><div class="n" id="stat-total">0</div><div class="l">All records</div></div>
      </div>

      <section class="card">
        <div class="toolbar">
          <div>
            <label for="filter-date">Day</label>
            <input id="filter-date" type="date">
          </div>
          <label style="font-weight:400;display:flex;gap:8px;align-items:center;margin:0 0 6px">
            <input id="show-all" type="checkbox" style="width:auto"> Show all days
          </label>
        </div>
        <div class="msg" id="dash-msg" hidden></div>
        <div id="appt-list"></div>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
