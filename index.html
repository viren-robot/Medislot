<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book an appointment · Medislot</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body data-page="booking">
  <header>
    <a class="brand" href="index.html">Medislot</a>
    <nav>
      <a href="index.html">Book</a>
      <a href="doctor.html">Doctor login</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <h1>Book an appointment</h1>
      <p class="sub">Choose a day and a free time slot.</p>

      <form id="booking-form" novalidate>
        <div class="grid">
          <div>
            <label for="name">Full name *</label>
            <input id="name" name="name" autocomplete="name" required>
          </div>
          <div>
            <label for="email">Email *</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div>
            <label for="phone">Phone *</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" required>
          </div>
          <div>
            <label for="date">Date *</label>
            <input id="date" name="date" type="date" required>
          </div>
          <div>
            <label for="time">Time *</label>
            <select id="time" name="time" required></select>
          </div>
          <div class="full">
            <label for="reason">Reason for visit</label>
            <textarea id="reason" name="reason" placeholder="e.g. annual check-up, fever, follow-up"></textarea>
          </div>
        </div>

        <div class="actions">
          <button class="btn" type="submit">Book appointment</button>
        </div>
        <div class="msg" id="booking-msg" hidden></div>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
