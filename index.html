<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book an appointment · Sharada Child Care, Hoskote</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body data-page="booking">
  <header>
    <a class="brand" href="index.html"><img src="images/logo.svg" alt="" width="32" height="32">Sharada Child Care</a>
    <nav>
      <a href="index.html">Book</a>
      <a href="doctor.html">Doctor login</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero-text">
        <h1>Sharada Child Care, Hoskote</h1>
        <p class="sub">Book your child's visit online. Pick a day and a free time slot, and we'll see you then.</p>
        <a class="btn" href="#booking">Book an appointment</a>
      </div>
      <img src="images/hero.svg" alt="A parent and child walking to a children's clinic" width="600" height="400">
    </section>

    <section class="card" id="booking">
      <h2>Book an appointment</h2>
      <p class="sub">Choose a day and a free time slot.</p>

      <form id="booking-form" novalidate>
        <div class="grid">
          <div>
            <label for="name">Parent's full name *</label>
            <input id="name" name="name" autocomplete="name" required>
          </div>
          <div>
            <label for="email">Email *</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div>
            <label for="phone">Phone *</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" required>
          </div>
          <div>
            <label for="date">Date *</label>
            <input id="date" name="date" type="date" required>
          </div>
          <div>
            <label for="time">Time *</label>
            <select id="time" name="time" required></select>
          </div>
          <div>
            <label for="visit">Reason for visit *</label>
            <select id="visit" name="visit" required>
              <option value="">Select a reason</option>
              <option>Vaccination</option>
              <option>Consultation</option>
              <option>Ear piercing</option>
              <option>Observation (less than 6 hrs)</option>
              <option>Observation (more than 6 hrs)</option>
            </select>
          </div>
          <div class="full">
            <span class="label-text">Child details *</span>
            <div id="children"></div>
            <button class="btn secondary small" id="add-child" type="button">+ Add another child</button>
          </div>
        </div>

        <div class="actions">
          <button class="btn" type="submit">Book appointment</button>
        </div>
        <div class="msg" id="booking-msg" hidden></div>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
